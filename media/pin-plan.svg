<path d="M71.1,640.8 L149.1,640.7 L228.5,639.4 L309.7,641.6 L309.9,685.4 L311.0,729.0 L308.9,773.5 L229.9,773.5 L149.9,773.2 L71.0,773.0 L70.1,729.3 L69.5,682.8 L70.5,641.0 L98.7,639.0"/>
<path d="M380.6,640.4 L458.5,641.3 L541.5,639.6 L620.3,640.0 L619.2,685.4 L618.9,726.6 L619.1,772.8 L541.4,771.1 L461.3,771.1 L379.7,771.6 L378.7,726.8 L380.9,684.5 L379.0,639.1 L409.7,640.9"/>
