<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 870" width="1000" height="870" font-family="'Segoe Print','Comic Sans MS','Bradley Hand','Chalkboard SE',cursive,sans-serif">
<rect width="1000" height="870" fill="#fbf8f1"/>
<text x="60" y="46" fill="#2f2b26" font-size="24" text-anchor="start">buddy mini — pins + faces</text>
<text x="60" y="70" fill="#7a736a" font-size="15" text-anchor="start">esp32 devkit v1</text>
<text x="82" y="129" fill="#7a736a" font-size="17" text-anchor="start">what</text>
<text x="348" y="129" fill="#7a736a" font-size="17" text-anchor="start">pin</text>
<text x="82" y="169" fill="#2f2b26" font-size="17" text-anchor="start">oled  sda</text>
<text x="348" y="169" fill="#2f2b26" font-size="17" text-anchor="start">21</text>
<text x="82" y="209" fill="#2f2b26" font-size="17" text-anchor="start">oled  scl</text>
<text x="348" y="209" fill="#2f2b26" font-size="17" text-anchor="start">22</text>
<text x="82" y="249" fill="#2f2b26" font-size="17" text-anchor="start">oled  vcc</text>
<text x="348" y="249" fill="#2f2b26" font-size="17" text-anchor="start">3v3</text>
<text x="82" y="289" fill="#2f2b26" font-size="17" text-anchor="start">button 1</text>
<text x="348" y="289" fill="#2f2b26" font-size="17" text-anchor="start">32</text>
<text x="82" y="329" fill="#2f2b26" font-size="17" text-anchor="start">button 2</text>
<text x="348" y="329" fill="#2f2b26" font-size="17" text-anchor="start">33</text>
<text x="82" y="369" fill="#2f2b26" font-size="17" text-anchor="start">buzzer  +</text>
<text x="348" y="369" fill="#2f2b26" font-size="17" text-anchor="start">25</text>
<text x="82" y="409" fill="#2f2b26" font-size="17" text-anchor="start">status led</text>
<text x="348" y="409" fill="#2f2b26" font-size="17" text-anchor="start">26</text>
<text x="82" y="449" fill="#2f2b26" font-size="17" text-anchor="start">every part</text>
<text x="348" y="449" fill="#2f2b26" font-size="17" text-anchor="start">gnd</text>
<text x="556" y="138" fill="#2f2b26" font-size="19" text-anchor="start">pins i can't touch</text>
<text x="556" y="178" fill="#2f2b26" font-size="16.5" text-anchor="start">6 – 11</text>
<text x="680" y="178" fill="#7a736a" font-size="14" text-anchor="start">wired to the flash chip. board just</text>
<text x="680" y="198" fill="#7a736a" font-size="14" text-anchor="start">won't boot.</text>
<text x="556" y="240" fill="#2f2b26" font-size="16.5" text-anchor="start">0, 2, 12, 15</text>
<text x="680" y="240" fill="#7a736a" font-size="14" text-anchor="start">boot pins. can stop it starting,</text>
<text x="680" y="260" fill="#7a736a" font-size="14" text-anchor="start">or stop uploads working.</text>
<text x="556" y="302" fill="#2f2b26" font-size="16.5" text-anchor="start">1, 3</text>
<text x="680" y="302" fill="#7a736a" font-size="14" text-anchor="start">usb serial. fights code upload.</text>
<text x="556" y="346" fill="#2f2b26" font-size="16.5" text-anchor="start">34 – 39</text>
<text x="680" y="346" fill="#7a736a" font-size="14" text-anchor="start">input only, no built-in pull-ups.</text>
<text x="532" y="442" fill="#7a736a" font-size="15" text-anchor="start">safe: 4, 5, 13, 14, 16–19, 21–23, 25–27, 32, 33</text>
<text x="532" y="466" fill="#7a736a" font-size="15" text-anchor="start">go by the number printed on the board —</text>
<text x="532" y="488" fill="#7a736a" font-size="15" text-anchor="start">pin order is different on other esp32s.</text>
<text x="62" y="496" fill="#7a736a" font-size="15" text-anchor="start">no 10k resistors on the buttons — 32 and 33 have</text>
<text x="62" y="518" fill="#7a736a" font-size="15" text-anchor="start">pull-ups inside the chip. a press reads LOW, not HIGH.</text>
<text x="62" y="540" fill="#7a736a" font-size="15" text-anchor="start">the led needs a 220 ohm resistor in line with it.</text>
<text x="60" y="598" fill="#2f2b26" font-size="20" text-anchor="start">the 3 faces</text>
<text x="240" y="598" fill="#7a736a" font-size="14" text-anchor="start">same eye + mouth positions on the 128x64 screen — only the eye shape changes,</text>
<text x="240" y="618" fill="#7a736a" font-size="14" text-anchor="start">so a blink is a cheap swap instead of redrawing the whole face.</text>
<circle cx="146" cy="692" r="12" fill="#2f2b26"/>
<circle cx="234" cy="692" r="12" fill="#2f2b26"/>
<text x="190" y="806" fill="#2f2b26" font-size="18" text-anchor="middle">normal</text>
<text x="190" y="828" fill="#7a736a" font-size="14" text-anchor="middle">idle / resting</text>
<text x="500" y="806" fill="#2f2b26" font-size="18" text-anchor="middle">happy</text>
<text x="500" y="828" fill="#7a736a" font-size="14" text-anchor="middle">when i press button 1</text>
<text x="810" y="806" fill="#2f2b26" font-size="18" text-anchor="middle">blink</text>
<text x="810" y="828" fill="#7a736a" font-size="14" text-anchor="middle">on a timer, every few sec</text>
<g fill="none" stroke="#2f2b26" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
