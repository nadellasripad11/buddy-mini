<path d="M68.9,261.2 Q265.0,262.3 459.7,261.1"/>
<path d="M70.3,303.1 Q265.0,303.2 459.1,302.3"/>
<path d="M70.7,342.6 Q265.0,340.2 460.0,341.5"/>
<path d="M70.9,381.6 Q265.0,381.5 461.0,380.8"/>
<path d="M69.5,422.2 Q265.0,423.0 460.3,422.0"/>
