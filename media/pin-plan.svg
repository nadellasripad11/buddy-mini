<text x="60" y="44" fill="#2f2b26" font-size="24" text-anchor="start">buddy mini — pin plan</text>
<text x="60" y="68" fill="#7a736a" font-size="15" text-anchor="start">esp32 devkit v1. these are the pins i plan to use.</text>
<text x="500" y="132" fill="#2f2b26" font-size="19" text-anchor="middle">oled screen</text>
<text x="500" y="160" fill="#7a736a" font-size="14.5" text-anchor="middle">sda → 21  ·  scl → 22</text>
<text x="500" y="181" fill="#7a736a" font-size="14.5" text-anchor="middle">vcc → 3v3  ·  gnd → gnd</text>
<text x="500" y="330" fill="#2f2b26" font-size="26" text-anchor="middle">esp32</text>
<text x="500" y="358" fill="#7a736a" font-size="15" text-anchor="middle">devkit v1</text>
<text x="500" y="390" fill="#7a736a" font-size="14" text-anchor="middle">runs everything</text>
<text x="500" y="414" fill="#7a736a" font-size="14" text-anchor="middle">and powers it</text>
<text x="160" y="282" fill="#2f2b26" font-size="18" text-anchor="middle">button 1</text>
<text x="160" y="306" fill="#7a736a" font-size="14" text-anchor="middle">one leg → 32</text>
<text x="160" y="326" fill="#7a736a" font-size="14" text-anchor="middle">other leg → gnd</text>
<text x="160" y="412" fill="#2f2b26" font-size="18" text-anchor="middle">button 2</text>
<text x="160" y="436" fill="#7a736a" font-size="14" text-anchor="middle">one leg → 33</text>
<text x="160" y="456" fill="#7a736a" font-size="14" text-anchor="middle">other leg → gnd</text>
<text x="840" y="282" fill="#2f2b26" font-size="18" text-anchor="middle">buzzer</text>
<text x="840" y="306" fill="#7a736a" font-size="14" text-anchor="middle">+ → 25</text>
<text x="840" y="326" fill="#7a736a" font-size="14" text-anchor="middle">− → gnd</text>
<text x="840" y="412" fill="#2f2b26" font-size="18" text-anchor="middle">status led</text>
<text x="840" y="436" fill="#7a736a" font-size="13.5" text-anchor="middle">26 → 220 ohm → led</text>
<text x="840" y="456" fill="#7a736a" font-size="14" text-anchor="middle">short leg → gnd</text>
<text x="500" y="567" fill="#2f2b26" font-size="15" text-anchor="middle">usb → my laptop</text>
<text x="524" y="244" fill="#2f2b26" font-size="15" text-anchor="start">i2c</text>
<text x="60" y="616" fill="#7a736a" font-size="14" text-anchor="start">no resistors on the buttons — pins 32 and 33 have pull-ups built in, i switch them on in code.</text>
<text x="60" y="640" fill="#7a736a" font-size="14" text-anchor="start">avoiding: 6–11 (flash) · 0, 2, 12, 15 (boot pins) · 1, 3 (usb serial) · 34–39 (no pull-ups)</text>
<text x="60" y="700" fill="#2f2b26" font-size="20" text-anchor="start">the 3 faces</text>
<text x="300" y="700" fill="#7a736a" font-size="14" text-anchor="start">drawn on the 128x64 screen — a blink is just swapping the eye shape</text>
<text x="220" y="860" fill="#2f2b26" font-size="17" text-anchor="middle">normal</text>
<text x="500" y="860" fill="#2f2b26" font-size="17" text-anchor="middle">happy</text>
<text x="780" y="860" fill="#2f2b26" font-size="17" text-anchor="middle">blink</text>
<text x="220" y="882" fill="#7a736a" font-size="13" text-anchor="middle">idle / resting</text>
<text x="500" y="882" fill="#7a736a" font-size="13" text-anchor="middle">button 1</text>
<text x="780" y="882" fill="#7a736a" font-size="13" text-anchor="middle">every few seconds</text>
</svg>