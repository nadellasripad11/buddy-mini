<text x="40" y="44" fill="#2f2b26" font-size="24" text-anchor="start" >buddy mini — how it all connects</text>
<text x="40" y="68" fill="#7a736a" font-size="15" text-anchor="start" >everything plugs into the esp32. nothing talks to anything else.</text>
<text x="450" y="120" fill="#2f2b26" font-size="19" text-anchor="middle" >oled screen</text>
<text x="450" y="145" fill="#7a736a" font-size="15" text-anchor="middle" >buddy's face</text>
<text x="450" y="300" fill="#2f2b26" font-size="26" text-anchor="middle" >esp32</text>
<text x="450" y="328" fill="#7a736a" font-size="16" text-anchor="middle" >the brain</text>
<text x="450" y="354" fill="#7a736a" font-size="13" text-anchor="middle" >runs the code + powers everything</text>
<text x="130" y="266" fill="#2f2b26" font-size="18" text-anchor="middle" >button 1</text>
<text x="130" y="290" fill="#7a736a" font-size="14" text-anchor="middle" >touch</text>
<text x="130" y="362" fill="#2f2b26" font-size="18" text-anchor="middle" >button 2</text>
<text x="130" y="386" fill="#7a736a" font-size="14" text-anchor="middle" >touch</text>
<text x="770" y="266" fill="#2f2b26" font-size="18" text-anchor="middle" >buzzer</text>
<text x="770" y="290" fill="#7a736a" font-size="14" text-anchor="middle" >buddy's voice</text>
<text x="770" y="362" fill="#2f2b26" font-size="18" text-anchor="middle" >led</text>
<text x="770" y="386" fill="#7a736a" font-size="14" text-anchor="middle" >“i'm awake” light</text>
<text x="450" y="528" fill="#2f2b26" font-size="18" text-anchor="middle" >my laptop</text>
<text x="450" y="550" fill="#7a736a" font-size="14" text-anchor="middle" >usb — power + uploads code</text>
<text x="478" y="202" fill="#2f2b26" font-size="15" text-anchor="start" >i2c</text>
<text x="478" y="224" fill="#7a736a" font-size="13" text-anchor="start" >just 2 wires</text>
<text x="280" y="258" fill="#7a736a" font-size="14" text-anchor="middle" >press</text>
<text x="280" y="400" fill="#7a736a" font-size="14" text-anchor="middle" >press</text>
<text x="620" y="256" fill="#7a736a" font-size="14" text-anchor="middle" >beep</text>
<text x="620" y="400" fill="#7a736a" font-size="14" text-anchor="middle" >on / off</text>
<text x="40" y="604" fill="#7a736a" font-size="14" text-anchor="start" >every single part also needs ground. pin numbers — still figuring those out.</text>
